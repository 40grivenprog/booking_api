name: Build and Push API Image

on:
  release:
    types: [published]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Build, tag, and push image to Artifact Registry
      id: build_image
      env:
        IMAGE_TAG: ${{ github.event.release.tag_name }}
        IMAGE_NAME: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/booking-api
      run: |
        docker build \
          -t $IMAGE_NAME:$IMAGE_TAG \
          -t $IMAGE_NAME:latest \
          .
        docker push $IMAGE_NAME:$IMAGE_TAG
        docker push $IMAGE_NAME:latest
        echo "image=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "full_image_path=$IMAGE_NAME" >> $GITHUB_OUTPUT

    - name: Notify completion
      run: |
        echo "API image built and pushed to Artifact Registry!"
        echo "Image: ${{ steps.build_image.outputs.full_image_path }}:${{ github.event.release.tag_name }}"
        echo "Tag: ${{ github.event.release.tag_name }}"
        echo "Next: Use Deploy workflow to deploy to dev/prod"
