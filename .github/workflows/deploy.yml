name: Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      image_tag:
        description: 'Image tag to deploy (leave empty for latest)'
        required: false
        type: string
        default: ''

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    env:
      # Cloud SQL connection name (format: PROJECT_ID:REGION:INSTANCE_NAME)
      CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
      # Secret Manager secret names (NOT the secret values!)
      # These should be names like: booking-app-dev-api-db-password
      DEV_DB_PASSWORD_SECRET: ${{ secrets.DEV_DB_PASSWORD_SECRET }}
      DEV_JWT_SECRET_SECRET: ${{ secrets.DEV_JWT_SECRET_SECRET }}
      PROD_DB_PASSWORD_SECRET: ${{ secrets.PROD_DB_PASSWORD_SECRET }}
      PROD_JWT_SECRET_SECRET: ${{ secrets.PROD_JWT_SECRET_SECRET }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Set image tag
      id: image_tag
      run: |
        if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
          TAG="${{ github.event.inputs.image_tag }}"
          echo "Using provided image tag: $TAG"
        else
          TAG="latest"
          echo "Using latest tag: $TAG"
        fi
        
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Using API image tag: $TAG"
        
        # Full image path
        IMAGE_PATH="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/booking-api:$TAG"
        echo "image_path=$IMAGE_PATH" >> $GITHUB_OUTPUT

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: booking-app-api-${{ github.event.inputs.environment }}
        image: ${{ steps.image_tag.outputs.image_path }}
        region: ${{ env.GCP_REGION }}
        flags: '--platform=managed'

    - name: Run Database Migrations
      if: github.event.inputs.environment == 'dev'
      run: |
        echo "Running database migrations for ${{ github.event.inputs.environment }} environment..."
        
        # Create and execute Cloud Run Job for migrations
        JOB_NAME="booking-app-migration-${{ github.event.inputs.environment }}"
        
        # Set Secret Manager secret names based on environment
        # These are NAMES of secrets in GCP Secret Manager, not the secret values themselves
        if [[ "${{ github.event.inputs.environment }}" == "dev" ]]; then
          DB_PASSWORD_SECRET_NAME="${{ env.DEV_DB_PASSWORD_SECRET }}"
          JWT_SECRET_SECRET_NAME="${{ env.DEV_JWT_SECRET_SECRET }}"
        else
          DB_PASSWORD_SECRET_NAME="${{ env.PROD_DB_PASSWORD_SECRET }}"
          JWT_SECRET_SECRET_NAME="${{ env.PROD_JWT_SECRET_SECRET }}"
        fi
        
        # Verify secret names are set
        if [[ -z "$DB_PASSWORD_SECRET_NAME" ]] || [[ -z "$JWT_SECRET_SECRET_NAME" ]]; then
          echo "ERROR: Secret Manager secret names are not set in GitHub Secrets!"
          echo "Expected: Names of secrets in GCP Secret Manager (e.g., booking-app-dev-api-db-password)"
          exit 1
        fi
        
        # Check if job exists
        if gcloud run jobs describe $JOB_NAME --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null; then
          echo "Job exists, updating..."
          gcloud run jobs update $JOB_NAME \
            --image=${{ steps.image_tag.outputs.image_path }} \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars="DB_HOST=/cloudsql/${{ env.CONNECTION_NAME }}" \
            --update-env-vars="DB_PORT=5432" \
            --update-env-vars="DB_USER=booking_admin" \
            --update-env-vars="DB_NAME=booking_${{ github.event.inputs.environment }}" \
            --update-env-vars="DB_SSLMODE=disable" \
            --update-secrets="DB_PASSWORD=${DB_PASSWORD_SECRET_NAME}:latest" \
            --update-secrets="JWT_SECRET=${JWT_SECRET_SECRET_NAME}:latest" \
            --update-cloudsql-instances=${{ env.CONNECTION_NAME }} \
            --command=/app/migrate \
            --args="up" \
            --project=${{ env.GCP_PROJECT_ID }}
        else
          echo "Job does not exist, creating..."
          gcloud run jobs create $JOB_NAME \
            --image=${{ steps.image_tag.outputs.image_path }} \
            --region=${{ env.GCP_REGION }} \
            --set-env-vars="DB_HOST=/cloudsql/${{ env.CONNECTION_NAME }}" \
            --set-env-vars="DB_PORT=5432" \
            --set-env-vars="DB_USER=booking_admin" \
            --set-env-vars="DB_NAME=booking_${{ github.event.inputs.environment }}" \
            --set-env-vars="DB_SSLMODE=disable" \
            --set-secrets="DB_PASSWORD=${DB_PASSWORD_SECRET_NAME}:latest" \
            --set-secrets="JWT_SECRET=${JWT_SECRET_SECRET_NAME}:latest" \
            --set-cloudsql-instances=${{ env.CONNECTION_NAME }} \
            --command=/app/migrate \
            --args="up" \
            --project=${{ env.GCP_PROJECT_ID }}
        fi
        
        # Execute the migration job
        echo "Executing migration job..."
        gcloud run jobs execute $JOB_NAME \
          --region=${{ env.GCP_REGION }} \
          --wait \
          --project=${{ env.GCP_PROJECT_ID }}
        
        echo "Database migrations completed successfully!"

    - name: Health Check
      run: |
        echo "Checking health endpoint..."
        
        SERVICE_URL=$(gcloud run services describe booking-app-api-${{ github.event.inputs.environment }} \
          --region=${{ env.GCP_REGION }} \
          --project=${{ env.GCP_PROJECT_ID }} \
          --format='value(status.url)')
        
        echo "Service URL: $SERVICE_URL"
        echo "Checking health at: $SERVICE_URL/health"
        curl -f "$SERVICE_URL/health" || exit 1
        echo "Health check passed!"

    - name: Deployment Summary
      run: |
        SERVICE_URL=$(gcloud run services describe booking-app-api-${{ github.event.inputs.environment }} \
          --region=${{ env.GCP_REGION }} \
          --project=${{ env.GCP_PROJECT_ID }} \
          --format='value(status.url)')
        
        echo "## Deployment Completed Successfully!"
        echo ""
        echo "**Environment:** ${{ github.event.inputs.environment }}"
        echo "**Image Tag:** ${{ steps.image_tag.outputs.tag }}"
        echo "**Service URL:** $SERVICE_URL"
        echo ""
        echo "### Next Steps:"
        echo "1. Deployment completed"
        echo "2. Health check passed"
        echo "3. Monitor logs if needed"
        echo "4. Ready for use!"
